# MariaDB 10.5 交叉编译 for 树莓派 (ARM64)
# 使用 GitHub Actions x86_64 runner 交叉编译 arm64 版本

name: Cross Compile MariaDB 10.5 for ARM64

on:
  workflow_dispatch:
    inputs:
      mariadb_version:
        description: 'MariaDB 版本'
        required: true
        default: '10.5.29'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install cross compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cmake \
            libpcre2-dev \
            libboost-all-dev \
            pkg-config \
            qemu-user-static

      - name: Download MariaDB source
        run: |
          cd ${{ github.workspace }}
          wget -q https://archive.mariadb.org/mariadb-${{ inputs.mariadb_version }}/source/mariadb-${{ inputs.mariadb_version }}.tar.gz
          tar xzf mariadb-${{ inputs.mariadb_version }}.tar.gz

      - name: Create cmake toolchain
        run: |
          mkdir -p ${{ github.workspace }}/mariadb-${{ inputs.mariadb_version }}/cmake
          cat > ${{ github.workspace }}/mariadb-${{ inputs.mariadb_version }}/cmake/arm64-linux-gnu.cmake << 'EOF'
SET(CMAKE_SYSTEM_NAME Linux)
SET(CMAKE_SYSTEM_PROCESSOR aarch64)
SET(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
SET(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
SET(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
SET(CMAKE_CROSSCOMPILING TRUE)
SET(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
SET(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
SET(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
SET(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
EOF

      - name: Configure MariaDB (cross compile)
        working-directory: mariadb-${{ inputs.mariadb_version }}
        run: |
          cmake . \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm64-linux-gnu.cmake \
            -DCMAKE_INSTALL_PREFIX=/usr/local/mariadb \
            -DSYSCONFDIR=/etc \
            -DWITH_ARIA_STORAGE_ENGINE=1 \
            -DWITH_XTRADB_STORAGE_ENGINE=1 \
            -DWITH_INNOBASE_STORAGE_ENGINE=1 \
            -DWITH_PARTITION_STORAGE_ENGINE=1 \
            -DWITH_MYISAM_STORAGE_ENGINE=1 \
            -DWITH_FEDERATED_STORAGE_ENGINE=1 \
            -DEXTRA_CHARSETS=all \
            -DDEFAULT_CHARSET=utf8mb4 \
            -DDEFAULT_COLLATION=utf8mb4_general_ci \
            -DWITH_READLINE=1 \
            -DWITH_EMBEDDED_SERVER=1 \
            -DENABLED_LOCAL_INFILE=1 \
            -DWITHOUT_TOKUDB=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CONFIG=mysql_release \
            -DWITH_SSL=bundled \
            -DWITH_INNODB_EXTRA_DEBUG=OFF \
            -DPLUGIN_AUTH_PAM=NO

      - name: Build MariaDB
        working-directory: mariadb-${{ inputs.mariadb_version }}
        run: |
          make -j2

      - name: Package (make install)
        working-directory: mariadb-${{ inputs.mariadb_version }}
        run: |
          mkdir -p ${{ github.workspace }}/pkg/usr/local/mariadb
          make install DESTDIR=${{ github.workspace }}/pkg

      - name: Create archive
        run: |
          cd ${{ github.workspace }}/pkg
          tar -czvf ../mariadb-${{ inputs.mariadb_version }}-arm64.tar.gz .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mariadb-${{ inputs.mariadb_version }}-arm64
          release_name: MariaDB ${{ inputs.mariadb_version }} ARM64
          assets: |
            mariadb-${{ inputs.mariadb_version }}-arm64.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}