name: Cross Compile MariaDB 10.5 for ARM64

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mariadb_version:
        type: string
        default: '10.5.6'

env:
  MARIADB_VERSION: ${{ github.event.inputs.mariadb_version || '10.5.6' }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
        
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            libpcre2-dev \
            libboost-all-dev \
            pkg-config \
            libaio-dev \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo-dev libidn2-dev libldap2-dev libcurl4-openssl-dev \
            libreadline-dev \
            libssl-dev \
            libgnutls28-dev \
            libgpg-error-dev \
            libgcrypt20-dev

      - name: Download MariaDB
        run: |
          wget https://archive.mariadb.org/mariadb-${{ env.MARIADB_VERSION }}/source/mariadb-${{ env.MARIADB_VERSION }}.tar.gz
          tar xzf mariadb-${{ env.MARIADB_VERSION }}.tar.gz

      - name: Copy toolchain
        run: |
          mkdir -p mariadb-${{ env.MARIADB_VERSION }}/cmake
          cp cmake/arm64-linux.cmake mariadb-${{ env.MARIADB_VERSION }}/cmake/

      - name: Configure
        working-directory: mariadb-${{ env.MARIADB_VERSION }}
        run: |
          cmake . \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm64-linux.cmake \
            -DCMAKE_INSTALL_PREFIX=/usr/local/mariadb \
            -DSYSCONFDIR=/etc \
            -DINSTALL_LIBDIR=lib \
            -DINSTALL_INCLUDEDIR=include \
            -DINSTALL_MYSQLSHAREDIR=share/mysql \
            -DDEFAULT_CHARSET=utf8mb4 \
            -DDEFAULT_COLLATION=utf8mb4_general_ci \
            -DWITHOUT_CLIENT=ON \
            -DWITHOUT_SERVER=OFF \
            -DWITH_ARIA_STORAGE_ENGINE=1 \
            -DWITH_XTRADB_STORAGE_ENGINE=1 \
            -DWITH_INNOBASE_STORAGE_ENGINE=1 \
            -DWITH_PARTITION_STORAGE_ENGINE=1 \
            -DWITH_MYISAM_STORAGE_ENGINE=1 \
            -DWITH_FEDERATED_STORAGE_ENGINE=1 \
            -DEXTRA_CHARSETS=none \
            -DWITHOUT_TOKUDB=1 \
            -DWITHOUT_ROCKSDB=1 \
            -DWITHOUT_SPIDER=1 \
            -DWITHOUT_OQGRAPH=1 \
            -DWITHOUT_MROONGA=1 \
            -DWITHOUT_CONNECT=1 \
            -DWITH_UNIT_TESTS=OFF \
            -DPLUGIN_AUTH_PAM=NO \
            -DWITH_SSL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CONFIG=mysql_release

      - name: Build
        working-directory: mariadb-${{ env.MARIADB_VERSION }}
        run: make -j2

      - name: Package
        working-directory: mariadb-${{ env.MARIADB_VERSION }}
        run: |
          mkdir -p ../pkg/usr/local/mariadb
          make install DESTDIR=${{ github.workspace }}/pkg

      - name: Create tarball
        run: |
          cd ${{ github.workspace }}/pkg
          tar -czvf ../mariadb-${{ env.MARIADB_VERSION }}-arm64.tar.gz .

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mariadb-${{ env.MARIADB_VERSION }}-arm64
          assets: mariadb-${{ env.MARIADB_VERSION }}-arm64.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}